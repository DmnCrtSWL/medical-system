name: CI / QA Checks

on:
  pull_request:
    branches: [ "master" ]

jobs:
  # ─── 1. Backend: Prisma Generate + TypeScript Build ──────────────────────────
  backend-checks:
    name: Backend (Node.js + Prisma + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client & Compile TypeScript
        working-directory: ./backend
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medsys_test

  # ─── 2. Frontend Admin: vue-tsc + Vite Production Build ──────────────────────
  frontend-checks:
    name: Frontend Admin (Vue 3 + TypeScript + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type Check & Production Build
        working-directory: ./frontend
        run: npm run build

  # ─── 3. Mobile App: TypeScript Strict Check ───────────────────────────────────
  mobile-checks:
    name: Mobile App (React Native + Expo + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci --legacy-peer-deps

      - name: TypeScript Strict Type Check
        working-directory: ./mobile
        run: ./node_modules/.bin/tsc --noEmit

  # ─── 4. Workplan App: Build Verification ─────────────────────────────────────
  workplan-checks:
    name: Workplan App (Demo Roadmap)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'workplan/app/package-lock.json'

      - name: Install Dependencies
        working-directory: ./workplan/app
        run: npm ci || npm install

      - name: Build and Verify
        working-directory: ./workplan/app
        run: npm run build
