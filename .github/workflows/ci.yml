name: CI / QA Checks

on:
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'workplan/app/package-lock.json'

    - name: Install Dependencies (Frontend)
      working-directory: ./workplan/app
      run: npm ci || npm install

    - name: Build and Verify Frontend
      working-directory: ./workplan/app
      run: npm run build
